<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in</title>
<style>
  body { 
    font-family: Inter, system-ui, sans-serif; 
    background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%); 
    margin: 0; 
    min-height: 100vh; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 1rem;
    color: #1f2937;
  }
  .auth-container {
    background: white;
    padding: 2rem;
    border-radius: 1rem;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    width: 100%;
    max-width: 400px;
    box-sizing: border-box;
  }
  h1 { margin-top: 0; margin-bottom: 1.5rem; text-align: center; }
  input { 
    display: block; 
    width: 100%; 
    margin-bottom: 12px; 
    padding: 0.85rem; 
    box-sizing: border-box; 
    border: 1px solid #d1d5db;
    border-radius: 0.75rem;
    background: #f8fafc;
    font-size: 16px; /* Prevents mobile iOS zoom */
  }
  input:focus { outline: 2px solid #6366f1; border-color: transparent; }
  button { 
    width: 100%; 
    padding: 0.85rem; 
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 0.75rem;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #4338ca; }
  #error { color: #dc2626; min-height: 1.2em; margin-bottom: 8px; font-size: 0.9rem; text-align: center; }
  p { text-align: center; margin-top: 1.5rem; font-size: 0.95rem; }
  a { color: #4f46e5; text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="auth-container">
    <h1>Log in</h1>
    <div id="error"></div>
    <form id="login-form">
      <input type="text" name="username" placeholder="Username" autocomplete="username" required>
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <p><a href="/register.html">Need an account? Register</a></p>
  </div>

  <script>
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) window.location.reload();
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      const form = new FormData(e.target);
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: form.get('username'),
          password: form.get('password'),
        }),
      });
      if (res.ok) {
        window.location.href = '/';
        return;
      }
      if (res.status === 409) {
        window.location.href = '/';
        return;
      }
      errorEl.textContent = await res.text();
    });
  </script>
</body>
</html>
